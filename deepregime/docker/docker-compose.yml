version: '3.9'

services:

  # ── FastAPI Backend ──────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deepregime_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://deepregime:deepregime123@postgres:5432/market_regime
      - REDIS_URL=redis://redis:6379/0
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
    volumes:
      - model_artifacts:/app/models/saved
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deepregime_net
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2

  # ── Streamlit Dashboard ───────────────────────────────────
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deepregime_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql+asyncpg://deepregime:deepregime123@postgres:5432/market_regime
      - API_BASE_URL=http://api:8000
    volumes:
      - model_artifacts:/app/models/saved
    depends_on:
      - api
    networks:
      - deepregime_net
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: deepregime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepregime
      POSTGRES_PASSWORD: deepregime123
      POSTGRES_DB: market_regime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepregime"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepregime_net

  # ── Redis (Caching + Pub/Sub) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deepregime_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepregime_net

  # ── Celery Worker (Background Tasks) ──────────────────────
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deepregime_celery
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://deepregime:deepregime123@postgres:5432/market_regime
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - model_artifacts:/app/models/saved
    depends_on:
      - redis
      - postgres
    networks:
      - deepregime_net
    command: celery -A api.tasks worker --loglevel=info --concurrency=2

  # ── Nginx Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deepregime_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
    networks:
      - deepregime_net

networks:
  deepregime_net:
    driver: bridge

volumes:
  postgres_data:
  model_artifacts:
  app_logs:
